[project]
name = "storepilot-ai-server"
version = "0.1.0"
description = "StorePilot category matching AI server"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "sentence-transformers==3.3.1",
    "numpy==2.2.1",
    "pydantic==2.10.4",
    "kiwipiepy==0.21.0",
    "faiss-cpu>=1.14.3",
    "python-multipart>=0.0.32",
    "torch>=2.11.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
